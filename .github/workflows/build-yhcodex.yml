name: Build yhcodex

on:
  push:
    branches:
      - rename-binary-yhcodex
  pull_request:
    branches:
      - rename-binary-yhcodex
  workflow_dispatch:

env:
  CODEX_REPO_ROOT: ${{ github.workspace }}

jobs:
  build:
    name: Build yhcodex - ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
    defaults:
      run:
        working-directory: codex-rs

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-xlarge
            target: aarch64-apple-darwin
            artifact_name: yhcodex-aarch64-apple-darwin
          - runner: macos-15-xlarge
            target: x86_64-apple-darwin
            artifact_name: yhcodex-x86_64-apple-darwin
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: yhcodex-x86_64-unknown-linux-gnu
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: yhcodex-aarch64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Build yhcodex
        shell: bash
        run: |
          set -euo pipefail
          STABLE_GIT_COMMIT="$(git rev-parse HEAD)"
          export STABLE_GIT_COMMIT
          cargo build --target ${{ matrix.target }} --release --bin yhcodex

      - name: Prepare artifacts
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/yhcodex"
          if [[ ! -f "$binary" ]]; then
            echo "Binary $binary not found"
            exit 1
          fi
          mkdir -p dist
          cp "$binary" "dist/${{ matrix.artifact_name }}"
          ls -lh "dist/${{ matrix.artifact_name }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ matrix.artifact_name }}
          path: codex-rs/dist/${{ matrix.artifact_name }}
          if-no-files-found: error
